<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rome instances</title>
<style>
	:root {
		color-scheme: light dark;
		--fg: #1d1d1f;
		--muted: #888;
		--border: #e5e5e5;
		--accent: #0066cc;
		--err: #cc3333;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--fg: #ececec;
			--muted: #888;
			--border: #2a2a2a;
			--accent: #4ea1ff;
		}
	}
	body {
		font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
		max-width: 640px;
		margin: 4rem auto;
		padding: 0 1.25rem;
		color: var(--fg);
	}
	h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
	header p { color: var(--muted); margin: 0 0 1.5rem; }
	ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--border); }
	li { border-bottom: 1px solid var(--border); }
	a.row { display: flex; align-items: baseline; gap: 1rem; padding: 0.75rem 0.25rem; text-decoration: none; color: inherit; }
	a.row:hover { color: var(--accent); }
	.slug { flex: 1; font-weight: 500; }
	.host { color: var(--muted); font: 0.85rem ui-monospace, "SF Mono", Menlo, monospace; }
	.note { color: var(--muted); padding: 1rem 0; }
	.err { color: var(--err); padding: 1rem 0; }
	footer { margin-top: 2rem; color: var(--muted); font-size: 0.85rem; }
	footer a { color: inherit; }
</style>
</head>
<body>
<header>
	<h1>Rome instances</h1>
	<p>Live, auto-discovered from Traefik. Reload to refresh.</p>
</header>
<ul id="instances"><li class="note">Loading…</li></ul>
<footer>
	<a href="http://localhost:8080/dashboard/" target="_blank" rel="noopener">Traefik dashboard →</a>
</footer>
<script>
	const list = document.getElementById("instances");
	const HOST_RE = /Host\(`([^`]+\.rome\.localhost)`\)/;
	// Worktree routers are named `<slug>-rome` (see compose.dev.yml). Filtering
	// on this suffix excludes obs-* singletons and the landing router itself.
	const ROUTER_RE = /^([^@]+)-rome@docker$/;

	async function load() {
		try {
			const res = await fetch("/_api/api/http/routers", { cache: "no-store" });
			if (!res.ok) throw new Error("Traefik API returned " + res.status);
			const routers = await res.json();
			const hosts = new Map();
			for (const r of routers) {
				if (r.status && r.status !== "enabled") continue;
				if (!ROUTER_RE.test(r.name || "")) continue;
				const m = (r.rule || "").match(HOST_RE);
				if (!m) continue;
				const host = m[1];
				const slug = host.replace(/\.rome\.localhost$/, "");
				if (!hosts.has(host)) hosts.set(host, slug);
			}
			if (hosts.size === 0) {
				list.innerHTML = '<li class="note">No instances running. Start one with <code>pnpm dev:all</code>.</li>';
				return;
			}
			const entries = [...hosts.entries()].sort((a, b) => a[1].localeCompare(b[1]));
			list.innerHTML = entries
				.map(([host, slug]) => {
					const url = `http://${host}:3000/`;
					const safeSlug = slug.replace(/[<&>]/g, (c) => ({ "<": "&lt;", "&": "&amp;", ">": "&gt;" }[c]));
					return `<li><a class="row" href="${url}"><span class="slug">${safeSlug}</span><span class="host">${host}</span></a></li>`;
				})
				.join("");
		} catch (e) {
			list.innerHTML = `<li class="err">Failed to load instances: ${e.message}</li>`;
		}
	}
	load();
</script>
</body>
</html>

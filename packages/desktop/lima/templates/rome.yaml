# Rome — Lima template
#
# Boots the Rome-baked Alpine guest image shipped inside the .app
# at Rome.app/Contents/Resources/lima/images/. No first-launch OS download:
# the image already has linux-virt, openssh, containerd, nerdctl, and
# cni-plugins installed. Cloud-init has nothing to provision.
#
# Key choices:
#   - vmType: vz — Virtualization.framework backend; no QEMU dependency
#     on Apple Silicon (macOS 13+).
#   - default user-mode (slirp) networking — guest outbound rides
#     limactl hostagent socket() calls, so host-side TUN proxies treat
#     Rome's traffic like Safari's.
#   - containerd.user: false — DO NOT let Lima install nerdctl-full from
#     GitHub at first boot. The image ships Alpine's containerd + nerdctl
#     packages; Lima's installer would either duplicate them or race.

minimumLimaVersion: 2.0.0

# Rome-owned prebuilt guest image. The {{.Dir}} expansion resolves to the
# directory containing the rendered lima.yaml (Lima copies the template
# there at instance creation time); we use a relative ../images/ path so
# the bundled qcow2 next to the template is the source of truth.
#
# IMAGE_FILENAME below MUST match packages/desktop/scripts/fetch-guest-image.mjs.
# Bumping the image filename forces a Lima image-cache miss, which the
# provider observes and uses to rebuild the VM (see LimaRuntimeProvider).
images:
- location: "{{.Dir}}/../images/rome-guest-aarch64-3.21.7-2.qcow2"
  arch: aarch64

# We intentionally do NOT base on `_default/mounts`, and we intentionally
# do NOT mount $HOME. Two reasons:
#
#   1. Privacy: the default template exposes the entire $HOME (read-only)
#      into the VM. Anything that runs in the guest — including third-party
#      container images — can then read the user's SSH keys, browser
#      profiles, every other project on disk. Rome has no need for
#      that surface; the only host path it touches is ~/.rome-desktop.
#
#   2. Merge order: Lima splices base-template top-level keys *after* ours,
#      so a `mounts:` block in `_default/mounts` would silently overwrite
#      any `mounts:` we declare here. The writable override would vanish
#      and the container's bind-mount would land on a read-only virtiofs
#      share (we've seen this — chown of /home/rome fails and Rome
#      exits with code 1, dashboard never becomes healthy).
#
# So: only the Rome-owned subtree is mounted, and it is writable so
# `nerdctl run -v ~/.rome-desktop/runtime/rome-home:/home/rome` can
# persist Rome's SQLite DB, memory, chrome profile, and CLI login state
# (~/.config, ~/.cache) across container `rm`/recreate cycles.
mounts:
- location: "~/.rome-desktop"
  writable: true

vmType: vz
arch: aarch64

cpus: 2
memory: "4GiB"
disk: "20GiB"

mountType: virtiofs

# Containerd ships pre-installed in the guest image. Turning Lima's
# installer off skips the first-boot nerdctl-full download and matches
# the image's system-mode containerd socket at /run/containerd/containerd.sock.
containerd:
  system: false
  user: false

# Nothing left to provision at first boot — the image is already complete.
provision: []

# Reuse the `alpine` user that's already baked into the guest image instead of
# creating a host-named user (the default lima behavior, which mirrors macOS
# $USER into the guest). Why: lima's cidata script `00-alpine-user-group.sh`
# does `userdel alpine && reboot` whenever LIMA_CIDATA_USER != "alpine", which
# costs ~30 s on every cold start. Pinning name+uid+home to the pre-baked
# values short-circuits that whole branch.
user:
  name: alpine
  uid: 1000
  home: /home/alpine
  shell: /bin/sh

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false

# Forward the container's :8080 (published from `nerdctl run -p 8080:8080`)
# to a host Unix socket. Lima detects the listener inside the guest and
# auto-creates the host-side socket once the container starts listening.
#
# `hostSocket` is overridden at start time via `limactl start --set
# '.portForwards[0].hostSocket = "..."'` so the manager can pin the
# socket location to ~/.rome-desktop/runtime/rome.sock. The empty
# default below is a placeholder that yq replaces in place.
portForwards:
- guestPort: 8080
  guestIPMustBeZero: true
  hostSocket: ""
  proto: tcp

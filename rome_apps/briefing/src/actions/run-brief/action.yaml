name: briefing_run_brief
type: custom
description: >-
  Assemble and deliver a briefing for the guardian. Checks the calendar, recent
  messages on connected channels (WhatsApp, email), and all scouting-task
  findings gathered since the last brief, then has the assistant agent
  synthesize a concise brief and sends it to the configured channel. Use kind
  "morning" or "evening" for the scheduled briefs, or "test" for a manual test
  run. Normally invoked by a schedule.
complexity: complex
speed: slow
reliability: medium
sideEffects: write

name: briefing_add_scout
type: custom
description: >-
  Add a scouting task to the Briefing app. A scouting task is a detailed prompt
  that the assistant agent runs automatically on a repeating interval; its
  findings are folded into the next morning or evening brief. Use this when the
  guardian asks to "scout", "keep an eye on", "monitor", or "track" something on
  a schedule (e.g. "every 6 hours, check Hacker News for posts about Rome and
  summarize them"). Provide a short title, the full detailed prompt, and how
  often it should run in minutes.
complexity: simple
speed: fast
reliability: high
sideEffects: write

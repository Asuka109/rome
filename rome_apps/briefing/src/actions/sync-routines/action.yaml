name: briefing_sync_routines
type: custom
description: >-
  Reconcile the Briefing app's scheduled routines (morning brief, evening brief,
  and one routine per scouting task) from the current settings and scouts in the
  database. Run after changing briefing settings or adding/editing/removing a
  scouting task. Internal maintenance action.
complexity: simple
speed: fast
reliability: high
sideEffects: write

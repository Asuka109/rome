<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bloom — Claymorphism Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:ital,wght@0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Color tokens (from CSV Design System Variables) */
    --bg: #F4F1FA;
    --card-bg: rgba(255, 255, 255, 0.7);
    --card-solid: #FFFFFF;
    --text: #332F3A;
    --muted: #635F69;
    --accent: #7C3AED;
    --accent-light: #A78BFA;
    --accent2: #DB2777;
    --success: #10B981;
    --warning: #F59E0B;
    --lavender: #ECE7F6;

    /* Radius tokens */
    --radius-outer: 50px;
    --radius-card: 32px;
    --radius-inner: 24px;
    --radius-button: 20px;
    --radius-pill: 999px;

    /* Clay shadow stacks: outer dark drop + inner white highlight */
    --clay-soft:
      12px 12px 28px rgba(124, 58, 237, 0.14),
      -8px -8px 22px rgba(255, 255, 255, 0.9);
    --clay-card:
      14px 16px 34px rgba(99, 95, 105, 0.18),
      -10px -10px 26px rgba(255, 255, 255, 0.85),
      inset 2px 2px 6px rgba(255, 255, 255, 0.6),
      inset -3px -3px 8px rgba(124, 58, 237, 0.05);
    --clay-button:
      0 10px 22px rgba(124, 58, 237, 0.42),
      inset 0 2px 3px rgba(255, 255, 255, 0.45),
      inset 0 -4px 8px rgba(91, 33, 182, 0.35);
    --clay-pressed:
      0 4px 10px rgba(124, 58, 237, 0.4),
      inset 0 3px 7px rgba(91, 33, 182, 0.4);

    /* Spacing scale */
    --sp-1: 6px;
    --sp-2: 12px;
    --sp-3: 18px;
    --sp-4: 24px;
    --sp-5: 32px;

    /* Typography scale */
    --font-heading: 'Nunito', system-ui, sans-serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --fs-hero: 40px;
    --fs-section: 26px;
    --fs-card: 22px;
    --fs-body: 16px;
    --fs-small: 13px;

    /* Motion */
    --spring: 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease: 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-body);
    color: var(--text);
    background:
      radial-gradient(circle at 12% 8%, rgba(167, 139, 250, 0.35), transparent 42%),
      radial-gradient(circle at 92% 96%, rgba(219, 39, 119, 0.22), transparent 40%),
      var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 16px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Floating background blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(8px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
    animation: drift 9s ease-in-out infinite alternate;
  }
  .blob.b1 { width: 180px; height: 180px; top: 6%; left: -40px;
    background: radial-gradient(circle at 35% 30%, #C4B5FD, #7C3AED); animation-delay: 0s; }
  .blob.b2 { width: 140px; height: 140px; bottom: 10%; right: -30px;
    background: radial-gradient(circle at 35% 30%, #F9A8D4, #DB2777); animation-delay: 1.5s; }
  .blob.b3 { width: 110px; height: 110px; top: 48%; left: -50px;
    background: radial-gradient(circle at 35% 30%, #6EE7B7, #10B981); animation-delay: 3s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(18px, -20px) scale(1.05); }
    100% { transform: translate(-14px, 16px) scale(0.97); }
  }

  /* Phone frame */
  .phone {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 393px;
    background: var(--bg);
    border-radius: var(--radius-outer);
    padding: 14px;
    box-shadow:
      0 30px 60px rgba(51, 47, 58, 0.28),
      0 0 0 10px rgba(255, 255, 255, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }

  .screen {
    border-radius: 42px;
    background:
      radial-gradient(circle at 80% 0%, rgba(167, 139, 250, 0.22), transparent 45%),
      var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 760px;
  }

  /* Status bar */
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 26px 6px;
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 14px;
    color: var(--text);
  }
  .statusbar .icons { display: flex; gap: 7px; align-items: center; }
  .statusbar svg { display: block; }

  /* Header */
  header.app-header {
    padding: 10px 22px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .greeting .eyebrow {
    font-size: var(--fs-small);
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .greeting h1 {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: var(--fs-section);
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-top: 2px;
  }
  .greeting h1 .accent { color: var(--accent); }

  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 18px;
    background: linear-gradient(145deg, #A78BFA, #7C3AED);
    display: grid;
    place-items: center;
    color: #fff;
    box-shadow: var(--clay-soft);
    flex-shrink: 0;
    border: none;
    cursor: pointer;
    transition: transform var(--spring), box-shadow var(--ease);
  }
  .avatar:hover { transform: translateY(-2px) rotate(-3deg); }
  .avatar:active { transform: scale(0.92); }
  .avatar:focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; }

  /* Main scroll content */
  main {
    flex: 1;
    padding: 14px 22px 6px;
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  /* Hero card (spans full width — bento) */
  .hero-card {
    position: relative;
    border-radius: var(--radius-card);
    background:
      linear-gradient(150deg, #8B5CF6 0%, #7C3AED 55%, #6D28D9 100%);
    color: #fff;
    padding: 22px 22px 20px;
    box-shadow:
      14px 18px 36px rgba(124, 58, 237, 0.4),
      inset 0 2px 4px rgba(255, 255, 255, 0.35),
      inset 0 -6px 14px rgba(76, 29, 149, 0.5);
    overflow: hidden;
  }
  .hero-card::after {
    content: "";
    position: absolute;
    top: -40px; right: -30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.5), rgba(249,168,212,0.25));
    filter: blur(4px);
  }
  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .hero-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: var(--radius-pill);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--font-heading);
  }
  .hero-card h2 {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: var(--fs-hero);
    line-height: 1;
    letter-spacing: -1px;
    margin: 16px 0 4px;
    position: relative;
    z-index: 1;
  }
  .hero-card .sub {
    font-size: var(--fs-body);
    opacity: 0.92;
    position: relative;
    z-index: 1;
  }
  /* progress ring */
  .ring {
    width: 78px; height: 78px;
    flex-shrink: 0;
    position: relative;
  }
  .ring svg { transform: rotate(-90deg); }
  .ring .ring-label {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 18px;
  }

  /* Bento grid */
  .bento {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--sp-2);
  }
  .stat-card {
    border-radius: var(--radius-inner);
    background: var(--card-solid);
    padding: 16px;
    box-shadow: var(--clay-card);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stat-icon {
    width: 42px; height: 42px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    color: #fff;
    flex-shrink: 0;
  }
  .stat-icon.violet { background: linear-gradient(145deg, #A78BFA, #7C3AED); }
  .stat-icon.pink   { background: linear-gradient(145deg, #F472B6, #DB2777); }
  .stat-icon.green  { background: linear-gradient(145deg, #6EE7B7, #10B981); }
  .stat-icon.amber  { background: linear-gradient(145deg, #FCD34D, #F59E0B); }
  .stat-value {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .stat-value .unit { font-size: 14px; color: var(--muted); font-weight: 700; }
  .stat-label { font-size: var(--fs-small); color: var(--muted); font-weight: 500; }
  .trend {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 12px; font-weight: 700; font-family: var(--font-heading);
  }
  .trend.up { color: var(--success); }

  /* Section title */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px 0;
  }
  .section-head h3 {
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: var(--fs-card);
    letter-spacing: -0.4px;
  }
  .seeall {
    background: none; border: none; cursor: pointer;
    color: var(--accent); font-weight: 700; font-family: var(--font-heading);
    font-size: 14px; padding: 6px 8px; border-radius: 12px;
    transition: background var(--ease);
  }
  .seeall:hover { background: var(--lavender); }
  .seeall:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Habit list */
  .habit-list { display: flex; flex-direction: column; gap: var(--sp-2); }
  .habit {
    display: flex;
    align-items: center;
    gap: 14px;
    border-radius: var(--radius-inner);
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px 16px;
    box-shadow: var(--clay-card);
  }
  .habit-emoji {
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 16px;
    display: grid; place-items: center;
    color: #fff;
  }
  .habit-body { flex: 1; min-width: 0; }
  .habit-body .name {
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 16px;
  }
  .habit-body .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .habit-bar {
    height: 8px;
    border-radius: var(--radius-pill);
    background: var(--lavender);
    margin-top: 8px;
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(99,95,105,0.18);
  }
  .habit-bar i {
    display: block; height: 100%;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg, #A78BFA, #7C3AED);
  }
  .habit-bar i.pinkfill { background: linear-gradient(90deg, #F472B6, #DB2777); }
  .habit-bar i.greenfill { background: linear-gradient(90deg, #6EE7B7, #10B981); }

  /* check toggle */
  .check {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 14px;
    border: none; cursor: pointer;
    background: var(--lavender);
    box-shadow: inset 2px 2px 5px rgba(99,95,105,0.18), inset -2px -2px 5px rgba(255,255,255,0.9);
    display: grid; place-items: center;
    color: var(--muted);
    transition: transform var(--spring), background var(--ease), color var(--ease), box-shadow var(--ease);
  }
  .check:hover { transform: translateY(-1px); }
  .check:active { transform: scale(0.88); }
  .check:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
  .check[aria-pressed="true"] {
    background: linear-gradient(145deg, #34D399, #10B981);
    color: #fff;
    box-shadow: var(--clay-soft);
  }
  .check[aria-pressed="true"] .uncheck { display: none; }
  .check .checkmark { display: none; }
  .check[aria-pressed="true"] .checkmark { display: block; }

  /* Primary CTA */
  .cta-wrap { padding: 6px 2px 2px; }
  .cta {
    width: 100%;
    height: 56px;
    border: none;
    cursor: pointer;
    border-radius: var(--radius-button);
    background: linear-gradient(145deg, #A78BFA 0%, #7C3AED 100%);
    color: #fff;
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 17px;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: var(--clay-button);
    transition: transform var(--spring), box-shadow var(--ease);
  }
  .cta:hover { transform: translateY(-2px); }
  .cta:active { transform: scale(0.92); box-shadow: var(--clay-pressed); }
  .cta:focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; }

  /* Bottom tab bar */
  nav.tabbar {
    margin: 12px 14px 14px;
    background: var(--card-solid);
    border-radius: var(--radius-card);
    padding: 12px 14px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: var(--clay-card);
  }
  .tab {
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--muted);
    font-size: 11px; font-weight: 700; font-family: var(--font-heading);
    padding: 4px 8px; border-radius: 14px;
    transition: transform var(--spring), color var(--ease);
  }
  .tab:hover { transform: translateY(-2px); color: var(--accent); }
  .tab:active { transform: scale(0.9); }
  .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tab .tab-icon {
    width: 44px; height: 36px;
    border-radius: 14px;
    display: grid; place-items: center;
    transition: background var(--ease), color var(--ease), box-shadow var(--ease);
  }
  .tab.active { color: var(--accent); }
  .tab.active .tab-icon {
    background: linear-gradient(145deg, #A78BFA, #7C3AED);
    color: #fff;
    box-shadow: 0 8px 16px rgba(124,58,237,0.4), inset 0 2px 3px rgba(255,255,255,0.4);
  }

  @media (max-width: 400px) {
    body { padding: 14px 8px; }
    .phone { padding: 10px; border-radius: 40px; }
    :root { --fs-hero: 36px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

              <div class="meta">6 of 8 glasses</div>
              <div class="habit-bar"><i class="greenfill" style="width:75%"></i></div>
            </div>
            <button class="check" aria-pressed="true" aria-label="Mark Drink water complete">
              <svg class="uncheck" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
              <svg class="checkmark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
          </article>

          <article class="habit">
            <span class="habit-emoji" style="background:linear-gradient(145deg,#F472B6,#DB2777)">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2z"/><path d="M9 22h6"/></svg>
            </span>
            <div class="habit-body">
              <div class="name">Meditate</div>
              <div class="meta">5 of 10 minutes</div>
              <div class="habit-bar"><i class="pinkfill" style="width:50%"></i></div>
            </div>
            <button class="check" aria-pressed="false" aria-label="Mark Meditate complete">
              <svg class="uncheck" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
              <svg class="checkmark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
          </article>
        </section>

        <div class="cta-wrap">
          <button class="cta">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Add new habit
          </button>
        </div>
      </main>

      <nav class="tabbar" aria-label="Primary">
        <button class="tab active" aria-current="page">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
          </span>
          Home
        </button>
        <button class="tab">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l4-6 4 3 4-7 4 5"/><path d="M3 21h18"/></svg>
          </span>
          Stats
        </button>
        <button class="tab">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          </span>
          Plan
        </button>
        <button class="tab">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </span>
          Me
        </button>
      </nav>

    </div>
  </div>

  <script>
    // Toggle habit completion with spring squish (haptic-style affordance)
    document.querySelectorAll('.check').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var on = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', String(!on));
      });
    });
    // Tab switching
    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (x) {
          x.classList.remove('active'); x.removeAttribute('aria-current');
        });
        t.classList.add('active'); t.setAttribute('aria-current', 'page');
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORMA — Daily Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* Primary palette (Bauhaus primaries) */
    --color-red: #D02020;
    --color-blue: #1040C0;
    --color-yellow: #F0C020;
    /* Secondary */
    --color-bg: #F0F0F0;
    --color-fg: #121212;
    --color-muted: #E0E0E0;
    --color-paper: #FFFFFF;
    /* Structure */
    --border-width: 2px;
    --border: var(--border-width) solid var(--color-fg);
    --shadow-hard: 4px 4px 0px 0px var(--color-fg);
    --shadow-hard-lg: 6px 6px 0px 0px var(--color-fg);
    --radius-block: 0px;
    --radius-pill: 9999px;
    /* Typography */
    --font-display: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-weight-hero: 900;
    --fs-hero: clamp(2.4rem, 11vw, 3.2rem);
    --fs-h2: 1.35rem;
    --fs-body: 0.95rem;
    --fs-small: 0.72rem;
    /* Spacing */
    --sp-1: 6px;
    --sp-2: 12px;
    --sp-3: 18px;
    --sp-4: 24px;
    --sp-5: 36px;
    /* Motion: Bauhaus = mechanical, instant. No easing. */
    --t-press: 0ms;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-display);
    background:
      radial-gradient(var(--color-muted) 1.5px, transparent 1.5px) 0 0 / 18px 18px,
      var(--color-bg);
    color: var(--color-fg);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: var(--sp-3);
    -webkit-font-smoothing: antialiased;
  }

  /* Phone frame */
  .phone {
    width: 100%;
    max-width: 412px;
    background: var(--color-bg);
    border: 3px solid var(--color-fg);
    box-shadow: var(--shadow-hard-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ---- Status / app bar ---- */
  .appbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(var(--sp-3) + env(safe-area-inset-top, 0px)) var(--sp-3) var(--sp-2);
    border-bottom: var(--border);
    background: var(--color-paper);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }
  .brand .glyph {
    width: 30px;
    height: 30px;
    border: var(--border);
    background: var(--color-red);
    display: grid;
    place-items: center;
  }
  .brand .name {
    font-weight: 900;
    font-size: 1.15rem;
    text-transform: uppercase;
    letter-spacing: -0.04em;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border: var(--border);
    background: var(--color-paper);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--color-fg);
    transition: transform var(--t-press), box-shadow var(--t-press);
  }
  .icon-btn:hover { background: var(--color-yellow); }
  .icon-btn:focus-visible {
    outline: 3px solid var(--color-blue);
    outline-offset: 2px;
  }
  .icon-btn:active { transform: translate(2px, 2px); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ---- Scroll body ---- */
  .scroll {
    padding: var(--sp-3) var(--sp-3) var(--sp-2);
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  /* ---- Hero block ---- */
  .hero {
    position: relative;
    border: var(--border);
    background: var(--color-blue);
    color: var(--color-bg);
    box-shadow: var(--shadow-hard);
    padding: var(--sp-4);
    overflow: hidden;
  }
  .hero .deco {
    position: absolute;
    top: -28px;
    right: -28px;
    width: 120px;
    height: 120px;
    border-radius: var(--radius-pill);
    background: var(--color-yellow);
    border: var(--border);
  }
  .hero .deco2 {
    position: absolute;
    bottom: -40px;
    right: 56px;
    width: 64px;
    height: 64px;
    background: var(--color-red);
    border: var(--border);
  }
  .eyebrow {
    font-size: var(--fs-small);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-bottom: var(--sp-2);
    position: relative;
  }
  .hero h1 {
    font-size: var(--fs-hero);
    line-height: 0.92;
    font-weight: var(--font-weight-hero);
    text-transform: uppercase;
    letter-spacing: -0.05em;
    position: relative;
  }
  .hero h1 .accent { color: var(--color-yellow); }
  .hero .sub {
    margin-top: var(--sp-3);
    font-size: var(--fs-body);
    font-weight: 500;
    max-width: 22ch;
    position: relative;
  }

  /* ---- Ring / progress stat ---- */
  .focus-card {
    border: var(--border);
    background: var(--color-paper);
    box-shadow: var(--shadow-hard);
    padding: var(--sp-3);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: var(--sp-3);
    align-items: center;
  }
  .ring { width: 92px; height: 92px; flex: none; }
  .ring text { font-family: var(--font-display); }
  .focus-meta h2 {
    font-size: var(--fs-h2);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .focus-meta p {
    margin-top: var(--sp-1);
    font-size: var(--fs-small);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--color-blue);
  }
  .chips { display: flex; gap: var(--sp-1); margin-top: var(--sp-2); flex-wrap: wrap; }
  .chip {
    font-size: var(--fs-small);
    font-weight: 700;
    text-transform: uppercase;
    border: var(--border);
    padding: 3px 8px;
    background: var(--color-muted);
  }
  .chip.red { background: var(--color-red); color: var(--color-bg); }

  /* ---- Section header ---- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: var(--sp-1);
  }
  .section-head h2 {
    font-size: var(--fs-h2);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
  }
  .section-head a {
    font-size: var(--fs-small);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-fg);
    text-decoration: none;
    border-bottom: 3px solid var(--color-yellow);
  }
  .section-head a:hover { background: var(--color-yellow); }
  .section-head a:focus-visible { outline: 3px solid var(--color-blue); outline-offset: 2px; }

  /* ---- Habit list ---- */
  .habits { display: flex; flex-direction: column; gap: var(--sp-2); }
  .habit {
    display: grid;
    grid-template-columns: 46px 1fr auto;
    align-items: center;
    gap: var(--sp-3);
    border: var(--border);
    background: var(--color-paper);
    box-shadow: var(--shadow-hard);
    padding: var(--sp-2) var(--sp-3);
    transition: transform var(--t-press), box-shadow var(--t-press);
  }
  .habit .mark {
    width: 46px;
    height: 46px;
    border: var(--border);
    display: grid;
    place-items: center;
    color: var(--color-bg);
  }
  .habit .mark.red { background: var(--color-red); }
  .habit .mark.blue { background: var(--color-blue); }
  .habit .mark.yellow { background: var(--color-yellow); color: var(--color-fg); border-radius: var(--radius-pill); }
  .habit .mark svg { width: 24px; height: 24px; }
  .habit .info h3 {
    font-size: 1rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .habit .info span {
    display: inline-block;
    margin-top: 4px;
    font-size: var(--fs-small);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--color-fg);
    opacity: 0.7;
  }
  /* toggle check */
  .check {
    width: 36px;
    height: 36px;
    border: var(--border);
    background: var(--color-paper);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--color-fg);
    transition: transform var(--t-press), box-shadow var(--t-press);
    box-shadow: 2px 2px 0 0 var(--color-fg);
  }
  .check svg { width: 22px; height: 22px; opacity: 0; }
  .check:hover { background: var(--color-yellow); }
  .check:focus-visible { outline: 3px solid var(--color-blue); outline-offset: 2px; }
  .check:active { transform: translate(2px, 2px); box-shadow: none; }
  .check[aria-pressed="true"] {
    background: var(--color-fg);
    color: var(--color-bg);
    box-shadow: none;
    transform: translate(2px, 2px);
  }
  .check[aria-pressed="true"] svg { opacity: 1; }

  /* ---- Primary CTA ---- */
  .cta {
    width: 100%;
    border: var(--border);
    background: var(--color-red);
    color: var(--color-bg);
    box-shadow: var(--shadow-hard);
    padding: var(--sp-3);
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    border-radius: var(--radius-pill);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    transition: transform var(--t-press), box-shadow var(--t-press);
  }
  .cta svg { width: 22px; height: 22px; }
  .cta:hover { background: var(--color-fg); }
  .cta:focus-visible { outline: 3px solid var(--color-blue); outline-offset: 3px; }
  .cta:active { transform: translate(4px, 4px); box-shadow: none; }

  /* ---- Bottom tab bar ---- */
  .tabbar {
    margin-top: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: var(--border);
    background: var(--color-paper);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab {
    border: none;
    background: var(--color-paper);
    border-right: var(--border);
    padding: var(--sp-2) 0 calc(var(--sp-2) + 2px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    color: var(--color-fg);
    font-family: var(--font-display);
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: transform var(--t-press);
  }
  .tab:last-child { border-right: none; }
  .tab svg { width: 22px; height: 22px; }
  .tab:hover { background: var(--color-muted); }
  .tab:focus-visible { outline: 3px solid var(--color-blue); outline-offset: -3px; }
  .tab:active { transform: translateY(2px); }
  .tab[aria-current="page"] { background: var(--color-yellow); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="phone" aria-label="FORMA daily practice app">
    <header class="appbar">
      <div class="brand">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#F0F0F0" stroke-width="2.5">
            <rect x="3" y="3" width="8" height="8"/>
            <circle cx="16.5" cy="16.5" r="4.5"/>
          </svg>
        </span>
        <span class="name">Forma</span>
      </div>
      <button class="icon-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </header>

    <div class="scroll">
      <section class="hero" aria-labelledby="hero-title">
        <span class="deco" aria-hidden="true"></span>
        <span class="deco2" aria-hidden="true"></span>
        <p class="eyebrow">Friday · May 30</p>
        <h1 id="hero-title">Build<br>the <span class="accent">habit</span></h1>
        <p class="sub">Three sessions left to close your weekly form.</p>
      </section>

      <section class="focus-card" aria-label="Today's progress">
        <svg class="ring" viewBox="0 0 100 100" role="img" aria-label="68 percent of today complete">
          <circle cx="50" cy="50" r="40" fill="none" stroke="#E0E0E0" stroke-width="12"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="#1040C0" stroke-width="12"
                  stroke-dasharray="251.3" stroke-dashoffset="80.4"
                  transform="rotate(-90 50 50)" stroke-linecap="butt"/>
          <text x="50" y="55" text-anchor="middle" font-size="24" font-weight="900" fill="#121212">68%</text>
        </svg>
        <div class="focus-meta">
          <h2>On Track</h2>
          <p>5-day streak</p>
          <div class="chips">
            <span class="chip red">2 due</span>
            <span class="chip">12 min focus</span>
          </div>
        </div>
      </section>

      <div class="section-head">
        <h2>Today</h2>
        <a href="#all" aria-label="View all habits">All</a>
      </div>

      <section class="habits" aria-label="Habit list">
        <article class="habit">
          <span class="mark red" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter">
              <path d="M12 3v6l4 2"/>
              <circle cx="12" cy="13" r="8"/>
            </svg>
          </span>
          <div class="info">
            <h3>Deep Work</h3>
            <span>90 min block</span>
          </div>
          <button class="check" aria-pressed="false" aria-label="Mark Deep Work done">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square">
              <polyline points="4 13 9 18 20 5"/>
            </svg>
          </button>
        </article>

        <article class="habit">
          <span class="mark blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
              <rect x="4" y="4" width="16" height="16"/>
              <line x1="4" y1="10" x2="20" y2="10"/>
            </svg>
          </span>
          <div class="info">
            <h3>Read Pages</h3>
            <span>20 of 30 done</span>
          </div>
          <button class="check" aria-pressed="true" aria-label="Mark Read Pages done">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square">
              <polyline points="4 13 9 18 20 5"/>
            </svg>
          </button>
        </article>

        <article class="habit">
          <span class="mark yellow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
              <circle cx="12" cy="12" r="8"/>
              <line x1="12" y1="12" x2="12" y2="7"/>
            </svg>
          </span>
          <div class="info">
            <h3>Move Body</h3>
            <span>30 min walk</span>
          </div>
          <button class="check" aria-pressed="false" aria-label="Mark Move Body done">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square">
              <polyline points="4 13 9 18 20 5"/>
            </svg>
          </button>
        </article>
      </section>

      <button class="cta" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Practice
      </button>
    </div>

    <nav class="tabbar" aria-label="Primary">
      <button class="tab" aria-current="page" aria-label="Today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><rect x="4" y="4" width="16" height="16"/><line x1="4" y1="9" x2="20" y2="9"/></svg>
        Today
      </button>
      <button class="tab" aria-label="Stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="18" y1="20" x2="18" y2="9"/></svg>
        Stats
      </button>
      <button class="tab" aria-label="Streak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><circle cx="12" cy="12" r="8"/><polyline points="12 7 12 12 16 14"/></svg>
        Streak
      </button>
      <button class="tab" aria-label="Profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6"/></svg>
        You
      </button>
    </nav>
  </main>

  <script>
    document.querySelectorAll('.check').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var on = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', String(!on));
      });
    });
  </script>
</body>
</html>

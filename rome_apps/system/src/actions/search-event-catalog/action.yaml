name: search_event_catalog
type: system
description: Search the event types currently watchable by an event-bus routine — what producer apps have registered as emittable (e.g. Gmail new-message events once Composio is connected). Pass keywords describing the event ("gmail new email", "stripe payment") and a limit; returns the best-matching event types, each with a payloadSchema (JSON Schema for the event payload; schemaOrigin "observed" means it was inferred from a recent emission and is a guide, not a contract) so you can write a trigger.filter against real payload fields, plus a total match count. Use this to discover a routine's trigger event and its payload instead of guessing event names or field names. Empty when no producer has emitted a matching event yet; payloadSchema is absent until the type has been emitted with a non-empty payload.
complexity: simple
speed: fast
reliability: high
sideEffects: read-only

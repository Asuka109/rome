name: Mobile CI

# Validates the packages/mobile Expo shell on every change to it. The package
# is a regular member of the root pnpm workspace (single lockfile); this job
# exists for the Expo-specific validation the repo's main CI doesn't run —
# expo-doctor and the Metro bundle smoke test. (Root CI's `pnpm -r typecheck`
# already covers typecheck on every PR; it is repeated here only so this
# path-filtered job stays a self-contained signal.)

on:
  pull_request:
    paths:
      - "packages/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      # Workspace member: the root lockfile and workspace config (overrides,
      # peer rules) control mobile's entire resolved dependency graph — a
      # root-level bump can break Metro/Expo without touching packages/mobile.
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "packages/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  check:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      # Actions pinned to immutable commit SHAs, matching the other workflows.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      # Workspace member: install resolves against the ROOT lockfile.
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Expo doctor
        run: pnpm dlx expo-doctor

      # Smoke-test the real Metro/Expo bundle path. This catches resolver, Babel,
      # and asset regressions that typecheck and unit tests cannot — the one
      # mobile-specific validation that otherwise stays manual. No device needed.
      # EXPO_PUBLIC_* vars are inlined at bundle time (config.ts validates them
      # at runtime, which a bundle never executes), so none need to be set here.
      - name: Expo export (bundle smoke test)
        run: pnpm exec expo export --platform ios
